{% extends "local_control/base.html" %}
{% block title %}Desbloquear | Controle local{% endblock %}
{% block content %}
<section class="local-auth-card">
  <span class="local-kicker">ACESSO EXCLUSIVO NO LOCALHOST</span>
  <h1>Desbloquear painel mestre</h1>
  <p>Gerencie e-mails de login, senhas, empresas, níveis e bloqueios sem expor esta área dentro do sistema.</p>
  <form method="post" action="/controle-local/entrar" class="local-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Senha mestre<input type="password" name="password" required autocomplete="current-password" autofocus></label>
    <button class="local-primary" type="submit">Entrar no controle local</button>
  </form>
</section>
{% endblock %}
