{% extends "base.html" %}
{% block title %}Criar conta | DBMILESX{% endblock %}
{% block head %}
<style>
.login-simple{min-height:72vh;display:grid;place-items:center;padding:28px 16px}
.login-box{width:min(100%,560px);background:#0d1d30;border:1px solid rgba(83,167,215,.22);border-radius:22px;padding:28px}
.auth-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.auth-two{grid-template-columns:1fr}}
</style>
{% endblock %}
{% block content %}
<section class="login-simple">
  <div class="login-box">
    <span class="eyebrow">NOVA CONTA</span>
    <h1 style="font-size:1.55rem;margin:.45rem 0">Criar conta</h1>
    <p style="color:#91aabd">O Google Authenticator é opcional e pode ser ativado depois em Configurações → Segurança.</p>

    <form method="post" action="/register" class="form-stack" style="margin-top:18px">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Nome completo<input name="name" autocomplete="name" required placeholder="Seu nome completo"></label>
      <div class="auth-two">
        <label>Cargo<input name="job_title" placeholder="Ex.: Agente de viagens"></label>
        <label>WhatsApp<input name="phone" autocomplete="tel" placeholder="(85) 99999-9999"></label>
      </div>
      <label>E-mail<input type="email" name="email" autocomplete="email" required placeholder="seu@email.com"></label>
      <div class="auth-two">
        <label>Senha<input type="password" name="password" autocomplete="new-password" required placeholder="Sua senha"></label>
        <label>Confirmar senha<input type="password" name="password_confirm" autocomplete="new-password" required placeholder="Repita a senha"></label>
      </div>
      <button class="primary-button full large" type="submit">Criar conta</button>
    </form>
    <p class="auth-switch">Já possui conta? <a href="/login">Entrar</a></p>
  </div>
</section>
{% endblock %}
