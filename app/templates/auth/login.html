{% extends "base.html" %}
{% block title %}Entrar | DBMILESX{% endblock %}
{% block head %}<style>
.auth-main{min-height:100vh;display:grid;place-items:center;padding:20px}.simple-login{width:min(420px,100%)}.simple-login-card{padding:28px;border-radius:22px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow)}.simple-login-logo{display:flex;justify-content:center;margin-bottom:18px}.simple-login-logo img{width:190px;max-height:64px;object-fit:contain}.simple-login-card h1{margin:0;text-align:center;font-size:1.55rem}.simple-login-card>p{text-align:center;color:var(--muted);margin:6px 0 22px}.simple-login-links{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:4px;font-size:.8rem}.simple-login-links a{color:var(--cyan-2);font-weight:850;text-decoration:none}.simple-login-register{text-align:center;color:var(--muted);margin:16px 0 0}.simple-login-register a{color:var(--cyan-2);font-weight:850}.simple-login .primary-button{width:100%;margin-top:14px}@media(max-width:620px){.auth-main{padding:14px}.simple-login-card{padding:22px 18px;border-radius:18px}.simple-login-logo img{width:165px}.simple-login-card h1{font-size:1.35rem}}
</style>{% endblock %}
{% block content %}
<section class="simple-login">
  <div class="simple-login-card">
    <div class="simple-login-logo">
      <img class="brand-logo-dark" src="/static/brand/dbmilesx-dark.svg" alt="DBMILESX">
      <img class="brand-logo-light" src="/static/brand/dbmilesx-light.svg" alt="DBMILESX">
    </div>
    <h1>Bem-vindo de volta</h1>
    <p>Entre com sua conta para continuar.</p>
    <form method="post" action="/login" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>E-mail<input type="email" name="email" autocomplete="email" required placeholder="seu@email.com"></label>
      <label>Senha<input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"></label>
      <div class="simple-login-links"><a href="/forgot-password">Esqueci minha senha</a><a href="/register">Criar conta</a></div>
      <button type="submit" class="primary-button large"><svg class="ui-icon"><use href="#icon-arrow-right"></use></svg> Entrar no DBMILESX</button>
    </form>
    <p class="simple-login-register">Novo por aqui? <a href="/register">Criar minha conta</a></p>
  </div>
</section>
{% endblock %}
