{% extends "base.html" %}
{% block title %}Nova senha | DBMILESX{% endblock %}
{% block head %}
<style>
.login-simple{min-height:72vh;display:grid;place-items:center;padding:28px 16px}
.login-box{width:min(100%,500px);background:#0d1d30;border:1px solid rgba(83,167,215,.22);border-radius:22px;padding:28px}
.code-input{font-size:1.55rem!important;text-align:center;letter-spacing:.28em;font-weight:900}
.auth-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.auth-two{grid-template-columns:1fr}}
</style>
{% endblock %}
{% block content %}
<section class="login-simple">
  <div class="login-box">
    <span class="eyebrow">NOVA SENHA</span>
    <h1 style="font-size:1.45rem;margin:.5rem 0">Redefinir senha</h1>
    <p style="color:#91aabd">{{ email }}</p>
    <p style="color:#91aabd;line-height:1.5">Abra o Google Authenticator e informe o código atual de 6 dígitos.</p>

    <form method="post" action="/reset-password" class="form-stack" style="margin-top:16px">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Código do Google Authenticator
        <input class="code-input" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required placeholder="000000">
      </label>
      <div class="auth-two">
        <label>Nova senha<input type="password" name="password" autocomplete="new-password" required></label>
        <label>Confirmar senha<input type="password" name="password_confirm" autocomplete="new-password" required></label>
      </div>
      <button class="primary-button full large" type="submit">Salvar nova senha</button>
    </form>
    <p class="auth-switch"><a href="/login">Voltar para o login</a></p>
  </div>
</section>
{% endblock %}
