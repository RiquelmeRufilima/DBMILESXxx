{% extends "base.html" %}
{% block title %}Código de segurança | DBMILESX{% endblock %}
{% block head %}
<style>
.login-simple{min-height:72vh;display:grid;place-items:center;padding:28px 16px}
.login-box{width:min(100%,420px);background:#0d1d30;border:1px solid rgba(83,167,215,.22);border-radius:22px;padding:28px}
.code-input{font-size:1.65rem!important;text-align:center;letter-spacing:.3em;font-weight:900}
</style>
{% endblock %}
{% block content %}
<section class="login-simple">
  <div class="login-box">
    <span class="eyebrow">SEGUNDA ETAPA</span>
    <h1 style="font-size:1.45rem;margin:.5rem 0">Google Authenticator</h1>
    <p style="color:#91aabd;margin-bottom:18px">{{ email }}</p>

    <form method="post" action="/login/authenticator" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Código atual
        <input class="code-input" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required placeholder="000000">
      </label>
      <button class="primary-button full large" type="submit">Confirmar</button>
    </form>

    <p class="auth-switch"><a href="/login">Voltar para o login</a></p>
  </div>
</section>
{% endblock %}
